spring:
  application:
    name: fitlog
  config:
    # 手元の開発ではリポジトリ直下の .env（docker-compose と共通）から DB の設定を読む。
    # 本番（AWS）では .env は置かず、環境変数で渡す
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:fitlog}
    username: ${POSTGRES_USER:fitlog}
    password: ${POSTGRES_PASSWORD:fitlog}
  jooq:
    sql-dialect: postgres
  # メールの送信。手元の開発は Mailpit（docker-compose）、テストは Testcontainers の Mailpit に SMTP で送る（docs/tech-stack.md 3.8）
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  # multipart の大きさの上限。リクエスト全体は 10MB まで（超えると 413）。1つのファイルの上限はリクエスト全体と同じにして、
  # 1枚の画像の 2MB の上限はアプリで確かめる（どの画像が大きすぎるかを 400 の errors で返すため。docs/api.md A-20）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  threads:
    virtual:
      # 仮想スレッドを使う（docs/tech-stack.md 3.1）
      enabled: true

app:
  jwt:
    # 署名の鍵（32バイト以上）。.env か環境変数で渡す（.env.example）。ないと起動しない
    secret: ${JWT_SECRET:}
    # アクセストークンの有効期限（docs/api.md「共通のルール」）
    expiration: 15m
  refresh-token:
    expiration: 14d
    # Cookie の Secure 属性。HTTPS の本番では true にする（手元の開発は HTTP なので false）
    cookie-secure: ${REFRESH_TOKEN_COOKIE_SECURE:false}
    # 2つのタブが同時に再発行したときなどに、使い回しと間違えてログアウトさせないための猶予
    reuse-grace: 10s
  # 毎日の掃除（期限切れのトークン・古いメールの送信の記録を消す）の時刻（cron。秒 分 時 日 月 曜日。日本時間）。毎日 4:00
  cleanup-cron: "0 0 4 * * *"
  # 画像の保存先（S3）。既定値は手元の開発の LocalStack（docker-compose）に合わせてある。
  # 本番（AWS の S3）では S3_ENDPOINT を空にする。空なら IAM ロールの権限で AWS の S3 に接続する
  storage:
    bucket: ${S3_BUCKET:fitlog-images}
    region: ${S3_REGION:ap-northeast-1}
    endpoint: ${S3_ENDPOINT:http://localhost:4566}
  # メールアドレスの確認（docs/features.md F-05）
  email-verification:
    expiration: 24h
    # 確認の画面（S-05）の URL。メールのリンクは、これに ?token=… を付けたもの
    link-url: ${APP_BASE_URL:http://localhost:5173}/verify-email
  mail:
    # 送信元のアドレス
    from: ${MAIL_FROM:noreply@fitlog.local}
    # 同じアドレスに、window の間に max-per-window 通まで（確認メール・リセットメールを合わせて数える）
    max-per-window: 5
    window: 1h
    # 送信の記録を残す期間（毎日の掃除で、これより古いものを消す）
    log-retention: 1d
  # ログインの試行回数の制限（総当たりの対策）。同じメールアドレスで、最初の失敗から window の間に max-failures 回失敗したら、lock-duration の間ロックする
  login-attempt:
    max-failures: 5
    window: 15m
    lock-duration: 15m
  # パスワードのハッシュ・照合（BCrypt）を同時に動かす数と、空きを待つ時間。待っても空かなければ 503（SERVER_BUSY）
  password-hashing:
    max-concurrent: 1
    max-wait: 1s

server:
  tomcat:
    # 上限（10MB）を超えたリクエストの残りを読み捨てる量。既定の 2MB では、読み捨てきれずに接続を切り、
    # 画面が 413 の応答（PAYLOAD_TOO_LARGE）を受け取れず通信のエラーになる。画面から送れる大きさ（画像4枚×2MB＋記録）を少し超えた分まで読み捨てて、413 を返す
    max-swallow-size: 20MB

logging:
  level:
    # jOOQ は DB の接続を受け取るたびに DB の版を調べ、無償版の対象（PostgreSQL の最新版）より古いと警告を出す。
    # PostgreSQL 17 の機能の範囲では問題ないので、この警告を止める。WARN を無効にすると、jOOQ は版の確認そのものを飛ばす
    #（docs/tech-stack.md「jOOQ のコード生成」）
    org.jooq.impl.DefaultExecuteContext.logVersionSupport: error
