spring:
  application:
    name: fitlog
  config:
    # 手元の開発ではリポジトリ直下の .env（docker-compose と共通）から DB の設定を読む。
    # 本番（AWS）では .env は置かず、環境変数で渡す
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:fitlog}
    username: ${POSTGRES_USER:fitlog}
    password: ${POSTGRES_PASSWORD:fitlog}
  jooq:
    sql-dialect: postgres
  threads:
    virtual:
      # 仮想スレッドを使う（docs/tech-stack.md 3.1）
      enabled: true

app:
  jwt:
    # 署名の鍵（32バイト以上）。.env か環境変数で渡す（.env.example）。ないと起動しない
    secret: ${JWT_SECRET:}
    # アクセストークンの有効期限（docs/api.md「共通のルール」）
    expiration: 15m
  refresh-token:
    expiration: 14d
    # Cookie の Secure 属性。HTTPS の本番では true にする（手元の開発は HTTP なので false）
    cookie-secure: ${REFRESH_TOKEN_COOKIE_SECURE:false}
    # 2つのタブが同時に再発行したときなどに、使い回しと間違えてログアウトさせないための猶予
    reuse-grace: 10s
    # 期限切れの行を消す時刻（cron。秒 分 時 日 月 曜日。日本時間）。毎日 4:00
    cleanup-cron: "0 0 4 * * *"
  # ログインの試行回数の制限（総当たりの対策）。同じメールアドレスで、最初の失敗から window の間に max-failures 回失敗したら、lock-duration の間ロックする
  login-attempt:
    max-failures: 5
    window: 15m
    lock-duration: 15m
  # パスワードのハッシュ・照合（BCrypt）を同時に動かす数と、空きを待つ時間。待っても空かなければ 503（SERVER_BUSY）
  password-hashing:
    max-concurrent: 1
    max-wait: 1s

logging:
  level:
    # jOOQ は DB の接続を受け取るたびに DB の版を調べ、無償版の対象（PostgreSQL の最新版）より古いと警告を出す。
    # PostgreSQL 17 の機能の範囲では問題ないので、この警告を止める。WARN を無効にすると、jOOQ は版の確認そのものを飛ばす
    #（docs/tech-stack.md「jOOQ のコード生成」）
    org.jooq.impl.DefaultExecuteContext.logVersionSupport: error
