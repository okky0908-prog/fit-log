# テスト用の設定（@ActiveProfiles("test")）。
# DB は Testcontainers の使い捨てのコンテナを使う（support/TestcontainersConfiguration が上書きする）。
# ここでは、わざと存在しない宛先（.invalid は名前解決されない）にしておく。
# @Import(TestcontainersConfiguration.class) を付け忘れたテストは、開発用の DB（localhost:5432）に書き込まずに、ここで失敗する
spring:
  datasource:
    url: jdbc:postgresql://testcontainers-not-imported.invalid:5432/fitlog
  # メールも同じ（手元の Mailpit に送らない）
  mail:
    host: testcontainers-not-imported.invalid

app:
  jwt:
    # テスト用の署名の鍵（32バイト以上）。本物の鍵は .env か環境変数の JWT_SECRET で渡す
    secret: test-secret-for-jwt-signing-0123456789abcdef
