# PR と main への push のたびに、バックエンドとフロントエンドのビルドとテストを実行する。
# マージは、この CI が通ってから行う（CLAUDE.md のリポジトリ運用ルール）。
# E2E は、それを作る PR で足す（docs/test-plan.md 8.1）
#
# main のブランチ保護で、2つのジョブ（バックエンド・フロントエンド）を必須のチェックにしている（CLAUDE.md の 5）。
# - on に paths の絞り込みを入れない（文書だけの PR で CI が動かず、マージできなくなる）
# - ジョブの name を変えるときは、ブランチ保護の必須のチェックも直す
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じブランチに続けて push したら、古い方の実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: バックエンド（整形の確認・テスト）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # build は、整形の確認（Spotless）・jOOQ のコード生成・コンパイル・テスト・カバレッジの基準の確認をまとめて行う。
      # カバレッジが基準（計算 100%・Service 90%。docs/test-plan.md 6章）を下回ると、ここで落ちる。
      # jOOQ のコード生成とテストは、Testcontainers が pg_bigm 入りの PostgreSQL（db/Dockerfile）を作って立ち上げる
      # （GitHub のランナーには Docker が入っている。docker compose・.env は要らない）
      - name: ./gradlew build
        working-directory: backend
        run: ./gradlew build

      - name: テスト結果を保存（失敗したときの確認用）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/
          if-no-files-found: ignore

      # カバレッジのレポート（JaCoCo の HTML）。基準を下回ったときに、どの分岐が通っていないかを見るため、失敗したときも保存する
      - name: カバレッジのレポートを保存
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/build/reports/jacoco/test/html/
          if-no-files-found: ignore

  frontend:
    name: フロントエンド（整形の確認・Lint・テスト）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # 整形（Prettier）と Lint（oxlint）。どちらも frontend/ の下だけが対象（リポジトリ直下の mockup/ は対象にならない）
      - name: 整形の確認
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # 型チェック（tsc -b）と本番用のビルド
      - name: 型チェックとビルド
        run: npm run build

      # テストとカバレッジ。src/lib の分岐網羅が、ファイルごとに 90% を下回るとここで落ちる（docs/test-plan.md 6章）
      - name: テストとカバレッジ
        run: npm run test:coverage

      - name: カバレッジのレポートを保存
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
