# 手元の開発で使うコンテナ。テストは使わない（Testcontainers が使い捨てのコンテナを作る）。
# 前回の SNS アプリとポートが同じなので、同時に起動しない（CLAUDE.md）。
name: fitlog

services:
  postgres:
    # pg_bigm 入りの PostgreSQL 17（テストと同じ db/Dockerfile）
    build: ./db
    image: fitlog-postgres:local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fitlog}
      POSTGRES_USER: ${POSTGRES_USER:-fitlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitlog}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitlog} -d ${POSTGRES_DB:-fitlog}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 送ったメールを受け取り、画面（http://localhost:8025）で見せる。外には送らない（docs/tech-stack.md 3.8）
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "1025:1025"   # SMTP（バックエンドが送る先。application.yml の spring.mail）
      - "8025:8025"   # 画面と API

  # S3 の代わり（記録の画像の保存先）。2026.03.0 以降は起動に LocalStack のアカウントと認証トークンが必要になったため、
  # トークンなしで動く最後の版 4.14.0 に固定する（前回と同じ）。
  # 無料版はデータを保存しないので、コンテナを作り直すと画像は消える（バケットは起動時のスクリプトで作り直される）
  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: s3
      S3_BUCKET: ${S3_BUCKET:-fitlog-images}
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      # バケットを作るスクリプトまで終わったら「準備完了」
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
